<html lang="en">

<body>

  </header>

  <main class="container">
    <section class="form-section">
      <h2><span>🚘</span>Add / Update Car</h2>
      <form id="carForm">
        <input type="hidden" id="carIndex">
        <!-- <input type="text" id="carName" placeholder="Car Name" required> -->
        <input type="text" id="model" placeholder="Model" required>
        <input type="text" id="brand" placeholder="Brand" required>
         <input type="text" id="color" placeholder="Color" required>
        <input type="number" id="price" placeholder="Price ($)" required>
        <input type="number" id="year" placeholder="Year" required>
        <input type="text" id="status" placeholder="Status (Available/Sold)" required>
        <button type="submit">Save Car</button>
         <button id="Backbutton"><a href="dash.html">Back</a></button>

    <section class="inventory-section">

      <table id="inventoryTable">
        <thead>
          <tr>
            <th>SL.NO</th>

            <th>Color</th>

  <footer>
    <!-- <p>© 2025 Smart Car Inventory | Built with ❤️ using HTML, CSS, JS</p> -->
     <p>© 2026 CarSmart<img src="c:\Users\Gokulnath\Downloads\directions_car_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png">Inventory </p>

  <script src="script.js"></script>

  <style>
     
     /* ====== Global ====== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(90deg, #be3c3c, #3d0b12);
  color: #222;
}

header {
background: linear-gradient(90deg, #be3c3c, #3d0b12);
  color: white;
  text-align: center;
  padding: 1.5rem;
  font-size: 1.5rem;
  letter-spacing: 1px;
}

.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 2rem;
  padding: 2rem;
}

/* ====== Form Section ====== */
.form-section {
  background: linear-gradient(90deg, #be3c3c, #3d0b12);
   /* background-image: url('https://i.pinimg.com/736x/19/fa/68/19fa6882337389248c09e4ab67354451.jpg');
   background-size: cover; */
   padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  width: 350px;
  transition: transform 0.3s;
  
}

.form-section:hover {
  transform: scale(1.02);
}

.form-section h2 {
  text-align: center;
  margin-bottom: 1rem;
  color:white;
}

#carForm input, #carForm button {
  width: 90%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 1rem;
  font-weight: bold;
  
}

#carForm button {
 background-color: #801815;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s;
}

#carForm button:hover {
  background-color: #5e2523;
}

#Backbutton a{
  /* background-color: #801815; */
  color: white;
  border: none;
  outline: none;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s;
  text-decoration-line: none;
}

/* ====== Inventory Table ====== */
.inventory-section {
  flex: 1;
  min-width: 600px;
  /* background: rgb(138, 153, 170); */
  background-image: url('https://img.goodfon.com/original/2500x1500/b/5d/transport-vehicles-art-car-supercar-sportcar-render-mashin-9.jpg');
  background-size: cover;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  overflow-x: auto;
  color:white;
    transition: transform 0.3s;
}

.inventory-section:hover {
  transform: scale(1.02);
}

.inventory-section h2 {
  text-align: center;
  margin-bottom: 1rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
}

th, td {
  border-bottom: 1px solid #ddd;
  padding: 10px;
}

th {
  background-color: #2b2b2c;
  color: white;
}

tr:hover {
  background-color: rgba(0,0,0,0.30);
}

button.action-btn {
  border: none;
  border-radius: 4px;
  padding: 5px 10px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.edit {
  background-color: #747e85;
}

button.delete {
  background-color: #747e85;
}

button.edit:hover {
  background-color: #404757;
}

button.delete:hover {
  background-color: #404757;
}

/* ====== Footer ====== */
footer {
  text-align: center;
  background-color: #e23d3d;
  color: white;
  padding: 1rem;
  margin-top: 20px;
  font-weight: bold;
}

/* ====== Responsive ====== */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .inventory-section {
    min-width: 100%;
  }
}

  </style>




<script>

    const carForm = document.getElementById('carForm');
const inventoryTable = document.getElementById('inventoryTable').querySelector('tbody');
let cars = JSON.parse(localStorage.getItem('cars')) || [];

// Display cars on load
document.addEventListener('DOMContentLoaded', renderCars);

carForm.addEventListener('submit', (e) => {
  e.preventDefault();

  const carData = {
    // name: document.getElementById('carName').value,
    model: document.getElementById('model').value,
    brand: document.getElementById('brand').value,
    color: document.getElementById('color').value,
    price: document.getElementById('price').value,
    year: document.getElementById('year').value,
    status: document.getElementById('status').value
  };

  const index = document.getElementById('carIndex').value;

  if (index === "") {
    cars.push(carData);
  } else {
    cars[index] = carData;
    document.getElementById('carIndex').value = "";
  }

  localStorage.setItem('cars', JSON.stringify(cars));
  renderCars();
  carForm.reset();
});

function renderCars() {
  inventoryTable.innerHTML = "";
  cars.forEach((car, i) => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${car.model}</td>
      <td>${car.brand}</td>
      <td>${car.color}</td>
      <td>${car.price}</td>
      <td>${car.year}</td>
      <td>${car.status}</td>
      <td>
        <button class="action-btn edit" onclick="editCar(${i})">Edit</button>
        <button class="action-btn delete" onclick="deleteCar(${i})">Delete</button>
      </td>
    `;
    inventoryTable.appendChild(row);
  });
}

function editCar(index) {
  const car = cars[index];
  // document.getElementById('carName').value = car.name;
   document.getElementById('model').value = car.model;
  document.getElementById('brand').value = car.brand;
   document.getElementById('color').value = car.color;
  document.getElementById('price').value = car.price;
   document.getElementById('year').value = car.year;
  document.getElementById('status').value = car.status;
  document.getElementById('carIndex').value = index;
}

function deleteCar(index) {
  if (confirm("Are you sure you want to delete this car?")) {
    cars.splice(index, 1);
    localStorage.setItem('cars', JSON.stringify(cars));
    renderCars();
  }
}


</script>
</body>
</html>
