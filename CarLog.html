<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Inventory Cars | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      height: 110vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      background-image: url('https://static.vecteezy.com/system/resources/thumbnails/027/533/475/small_2x/car-or-bike-smokie-background-realistic-ai-generative-free-photo.jpg');
      background-size: cover;
      /*background: conic-gradient(from 0deg, #0d6efd, #6610f2, #6f42c1, #20c997, #0d6efd);*/
      animation: rotateBg 10s linear infinite;
    }

    @keyframes rotateBg {

        0%{background-image: url('https://png.pngtree.com/thumb_back/fh260/back_our/20190628/ourmid/pngtree-pink-underground-parking-lot-background-image_279994.jpg');
      background-size: cover;}
      100%{background-image: url('https://static.vecteezy.com/system/resources/previews/023/977/650/large_2x/front-view-dark-silhouette-of-a-modern-sport-red-car-isolated-on-dark-background-with-red-neon-light-and-smoke-ai-generated-free-photo.jpg');
      background-size: cover;}
      /*0% { background: conic-gradient(from 0deg, #0d6efd, #6610f2, #6f42c1, #20c997, #0d6efd); }
      100% { background: conic-gradient(from 360deg, #0d6efd, #6610f2, #6f42c1, #20c997, #0d6efd); }*/
    }

    /* Container for cars orbiting */
    .orbit {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      animation: rotateOrbit 12s linear infinite;
      display: flex;
      justify-content: center;
      align-items: center;
     
    }

    @keyframes rotateOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .car {
      position: absolute;
      font-size: 2.5rem;
      color: #fff;
      opacity: 0.85;
      animation: spin 12s linear infinite;
    }

    /* counter-rotate so cars stay upright while orbiting */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .car:nth-child(1) { transform: translateY(-200px); animation-delay: 0s; }
    .car:nth-child(2) { transform: translateX(200px); animation-delay: 3s; }
    .car:nth-child(3) { transform: translateY(200px); animation-delay: 6s; }
    .car:nth-child(4) { transform: translateX(-200px); animation-delay: 9s; }

    /* Login box */
    .login-card {
      position: relative;
      background: rgba(255, 255, 255, 0.1); 
      backdrop-filter: blur(12px);
      border-radius: 35px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      padding: 2.5rem;
      width: 100%;
    /* margin-top: 2.5%; */
      max-width: 420px;
      text-align: center;
      z-index: 2;
      transition: all 0.3s ease-in-out;
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
    }

    .login-card:hover {
  
  transform: scale(1.02); /* Slight zoom effect */
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);

}

    .login-card h2 {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .form-control {
      border-radius: 15px;
      padding: 0.75rem 1rem;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .form-control::placeholder {
      color: rgba(255,255,255,0.7);
    }

    

    .btn-primary {
      border-radius: 15px;
      width: 100%;
      padding: 0.75rem;
      font-weight: 600;
      background: linear-gradient(90deg, #be3c3c, #3d0b12);
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(253, 13, 13, 0.6);
    }

    .extra-links a {
      color: #fff;
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .extra-links a:hover {
      color: #ffd700;
    }

    .back-link{
      color:#ac9494;
    }
  </style>
</head>
<body>

  <!-- Orbit container -->
  <div class="orbit">
    <i class="fas fa-car car"></i>
    <i class="fas fa-car-side car"></i>
    <i class="fas fa-truck-pickup car"></i>
    <i class="fas fa-shuttle-van car"></i>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <h2><i class="fas fa-car-side me-2"></i>CarSMarT Inventory</h2>
    <p class="mb-4">Login to manage your car inventory</p>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email address" required>
      </div>
      <div class="mb-3">
         <!-- <label for="password" class="form-label"></label>  -->
        <div class="input-group">
        <input type="password" class="form-control" id="password" placeholder="Password" required>
         <button type="button" class="btn btn-outline-danger" id="togglePassword"><i class="fas fa-eye"></i></button>
      </div>
      </div>

      <a href="Homepage.html">
  <button type="button" class="btn btn-primary">Login</button>
</a>

      

      <!-- <button type="submit" class="btn btn-primary">Login</button> -->
    </form><br>
     <a href="cars2.html" class="back-link">← Back to Home</a>

    <div class="extra-links mt-3">
      <a href="#">Forgot Password?</a><br>
      <a href="#">Create Account</a>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    togglePassword.addEventListener('click', () => {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      togglePassword.innerHTML = type === 'password'
        ? '<i class="fas fa-eye"></i>'
        : '<i class="fas fa-eye-slash"></i>';
    });
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('🚗 Login successful! Redirecting...');
      <button type="button" class="btn btn-primary" onclick="window.location.href='dash.html'">Login</button>
      // Example redirect:
      // window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
