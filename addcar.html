<!-- src/main/resources/templates/add-car.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Car | Smart Car Inventory</title>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            /* background: linear-gradient(90deg, #be3c3c, #3d0b12); */
            background-image: url('https://img.magnific.com/free-vector/abstract-diagonal-red-shinny-shape-background_1409-1663.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            height:100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            /* background: rgb(228, 78, 85); */
            /* background-image: url('https://img.magnific.com/free-vector/abstract-diagonal-red-shinny-shape-background_1409-1663.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover; */
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #a01e1e;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
          /* background: linear-gradient(90deg, #be3c3c, #3d0b12); */
          background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQr-NkF2t7lL1r74u7QHmgs55Hb0M9Ss84xqeB-rlQ8uSF5q16zBmdK9emV&s=10');
            background-size: cover; 
            color:white;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            /* background-color: #da999d; */
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQr-NkF2t7lL1r74u7QHmgs55Hb0M9Ss84xqeB-rlQ8uSF5q16zBmdK9emV&s=10');
            background-size: cover; 
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
             background-image: url('https://img.magnific.com/free-vector/fashion-show-runway-with-red-lights_107791-29612.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover; 
        }

        a {
            display: inline-block;
            text-align: center;
            margin-top: 15px;
            color: #f0d1d4;
            font-weight:bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Add New Car</h2>
    <form th:action="@{/cars/add}" th:object="${car}" method="post">
        <input type="text" th:field="*{brand}" placeholder="Brand" required>
        <input type="text" th:field="*{model}" placeholder="Model" required>
        <input type="number" th:field="*{year}" placeholder="Year" required>
        <input type="number" step="0.01" th:field="*{price}" placeholder="Price" required>
        <input type="text" th:field="*{color}" placeholder="Color" required>
        <input type="text" th:field="*{imageUrl}" placeholder="Image URL (optional)">
        <button type="submit">Save Car</button>
    </form>
    <a href="dash.html">← Back to Dashboard</a>
</div>
</body>
</html>
