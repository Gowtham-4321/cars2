    nav {
      width: 100%;
      padding: 15px 60px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      left: 0;

      z-index: 100;

    }

      transition: background 0.3s ease, transform 0.3s ease;
    }

    .hero {
      height: 100vh;
      background: url('https://img.pikbest.com/origin/09/17/89/41kpIkbEsTV83.jpg!bw700') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    .hero h2 {
      z-index: 1;
      font-size: 3rem;
      color: #cfafaf;
      margin-right: 5%;
      animation: fadeInDown 1s ease;
    }


    .hero p {
      z-index: 1;
      max-width: 700px;
      font-size: 1.2rem;
      font-family: Georgia, 'Times New Roman', Times, serif;
      color: #ddd;
      margin-bottom: 4%;
          margin-top: 2%;
      margin-right: 5%;
      animation: fadeInUp 1.3s ease;
    }

   
    footer {
         background: rgba(0, 0, 0, 0.7);
         font-family:Georgia, 'Times New Roman', Times, serif;
   
      text-align: center;
	  font-weight:bold;
      padding: 20px;
       color: #be6a6a;
      font-size: 0.9rem;
    }

    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

  
    @media (max-width: 768px) {
      nav {

      }
